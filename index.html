<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>H₂S Sentinel | Exposure Monitoring</title>
<meta name="description" content="Monitor cumulative H₂S exposure across workers and facility zones."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"/>
<style>
:root{
  --bg:#1a2138; --fg:#f2f4fb; --muted:#aab3cf; --panel:#242c49; --raised:#2c3554;
  --border:#3c4670; --primary:#7fb4ff; --accent:#a78bfa; --on-primary:#141a2e;
  --success:#34d399; --warning:#fbbf24; --elevated:#fb923c; --danger:#f87171;
  --radius:.4rem;
}
*{box-sizing:border-box;border-color:var(--border);margin:0}
body{
  background:linear-gradient(160deg,#2b3a6b 0%,#1f2547 45%,#231a3f 100%) fixed;
  background-color:var(--bg); color:var(--fg);
  font-family:"IBM Plex Sans",sans-serif; min-width:320px; min-height:100vh; overflow-x:hidden;
}
.font-display,h1,h2,h3,.btn,.brand strong{font-family:"Barlow Condensed",sans-serif;letter-spacing:.02em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--fg)}
.ombre-bar{background:linear-gradient(90deg,var(--primary),var(--accent));color:var(--on-primary)}
.ombre-panel{background:linear-gradient(135deg,rgba(127,180,255,.14),rgba(167,139,250,.16))}
.ombre-text{background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.industrial-grid{background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:32px 32px}
@keyframes pulse{50%{opacity:.45;transform:scale(.92)}}
@media (prefers-reduced-motion:no-preference){.reader-pulse{animation:pulse 1.8s ease-in-out infinite}}

.container{max-width:1120px;margin:0 auto;padding:1.5rem 1rem 7rem}
@media(min-width:1024px){.container{max-width:1360px;padding:2rem 2.5rem 4rem}.header-in{max-width:1360px}}
.wrap{max-width:42rem;margin:0 auto}
@media(min-width:1024px){.wrap{max-width:56rem}.wrap.lg{max-width:76rem}.wrap.xl{max-width:84rem}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1rem}
.section-title h2{font-size:1.1rem;text-transform:uppercase;font-weight:600}
.back-head{display:flex;align-items:center;gap:.75rem;border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1.5rem}
.back-head .title{font-size:1.25rem;font-weight:700;text-transform:uppercase;line-height:1}
.back-head small{font-size:.7rem;color:var(--muted)}
.icon-btn{display:grid;place-items:center;width:2.75rem;height:2.75rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--raised)}
.btn{display:flex;min-height:3rem;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--radius);padding:0 1.25rem;font-size:1rem;font-weight:700;text-transform:uppercase;background:var(--primary);color:var(--on-primary);width:100%}
.btn:hover{filter:brightness(1.1)}
.btn.secondary{background:var(--raised);color:var(--fg);border:1px solid var(--border)}
.data-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--border);padding:.75rem 0}
.data-row:last-child{border:none}
.data-row .l{font-size:.85rem;color:var(--muted)}
.data-row .v{font-size:.85rem;font-weight:600;text-align:right}
.dot{display:inline-block;width:.65rem;height:.65rem;border-radius:50%;flex-shrink:0}
.dot.success{background:var(--success)}.dot.warning{background:var(--warning)}.dot.elevated{background:var(--elevated)}.dot.danger{background:var(--danger)}
.t-success{color:var(--success)}.t-warning{color:var(--warning)}.t-elevated{color:var(--elevated)}.t-danger{color:var(--danger)}.t-primary{color:var(--primary)}.t-muted{color:var(--muted)}
.callout{border-left:2px solid;padding:.75rem;font-size:.85rem;margin-top:1.25rem}
.grid-2{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.grid-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid-2.wide-left{grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr)}.grid-2.wide-right{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}}
.grid-2>*{min-width:0}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
@media(min-width:640px){.grid-3{gap:1rem}}
.grid-4{display:grid;gap:.75rem}
@media(min-width:640px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid-4{grid-template-columns:repeat(4,1fr)}}

/* header */
header{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border);background:rgba(26,33,56,.85);backdrop-filter:blur(8px)}
.header-in{max-width:1120px;margin:0 auto;height:4rem;display:flex;align-items:center;justify-content:space-between;padding:0 1rem}
.brand{display:flex;align-items:center;gap:.75rem;text-align:left}
.brand .logo{display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:var(--radius);font-weight:700}
.brand strong{display:block;font-size:1.25rem;line-height:1}
.brand small{font-size:.62rem;text-transform:uppercase;color:var(--muted)}
.nav{display:none;align-items:center;gap:.25rem}
.nav button{padding:.5rem 1rem;border-radius:var(--radius);font-size:.85rem;font-weight:500;color:var(--muted)}
.nav button.active{color:var(--primary);background:linear-gradient(135deg,rgba(127,180,255,.14),rgba(167,139,250,.16))}
@media(min-width:768px){.nav{display:flex}.menu-btn{display:none!important}}
.badge-count{position:absolute;top:-.25rem;right:-.25rem;min-width:1.25rem;display:grid;place-items:center;border-radius:999px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;padding:0 .25rem}
.dropdown{position:absolute;right:0;top:3rem;z-index:50;width:min(22rem,calc(100vw - 2rem));overflow:hidden;border-radius:var(--radius);border:1px solid var(--border);background:var(--panel);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.notice{display:flex;gap:.75rem;padding:.75rem;border-bottom:1px solid var(--border)}
.notice.read{opacity:.6}
.notice .body{flex:1;text-align:left}
.notice .body strong{display:block;font-size:.85rem}
.notice .body span{display:block;font-size:.75rem;color:var(--muted)}
.notice .time{font-size:.62rem;text-transform:uppercase;color:var(--muted);margin-top:.25rem;display:block}
.mobile-menu{border-top:1px solid var(--border);background:var(--panel);padding:.75rem}
.mobile-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:.75rem;font-size:.85rem}
.mobile-menu button:last-child{border:none}
/* bottom nav */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--border);background:rgba(36,44,73,.95);backdrop-filter:blur(8px);padding:.5rem .5rem max(.5rem,env(safe-area-inset-bottom))}
.bottom-nav .in{max-width:28rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.bottom-nav button{display:flex;min-height:3.5rem;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;font-size:.62rem;text-transform:uppercase;color:var(--muted)}
.bottom-nav button.active{color:var(--primary)}
@media(min-width:768px){.bottom-nav{display:none}}

.stat strong{display:block;font-size:2.5rem;line-height:1}
.stat span{display:block;margin-top:.5rem;font-size:.62rem;text-transform:uppercase;color:var(--muted)}
.stat .ic{font-size:1.25rem;margin-bottom:1.25rem;display:block}
.status-cell{display:flex;align-items:center;justify-content:space-between;border-radius:var(--radius);border:1px solid var(--border);background:var(--raised);padding:.75rem}
.status-cell strong{font-size:1.5rem}
.status-cell .lab{display:flex;align-items:center;gap:.5rem;font-size:.75rem}
.activity-row{display:grid;width:100%;grid-template-columns:1fr 1fr auto auto;align-items:center;gap:.75rem;border-bottom:1px solid var(--border);padding:.75rem 0;text-align:left}
.activity-row:last-child{border:none}
.quick{display:flex;align-items:center;gap:.75rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--panel);padding:1rem;text-align:left;font-size:.85rem;font-weight:600}
.quick:hover{border-color:#7d89b8}
.scan-frame{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:22rem;margin:0 auto 1.5rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--panel)}
.scan-frame .inner{position:absolute;inset:1.5rem;border:1px solid rgba(127,180,255,.5)}
.scan-frame .hint{position:absolute;bottom:2.25rem;font-size:.7rem;text-transform:uppercase;color:var(--muted)}
@media(min-width:1024px){.camera-frame{max-height:62vh;margin-bottom:0}}
.camera-frame{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:var(--radius);border:1px solid var(--border);background:var(--panel);margin-bottom:1.25rem}
.camera-frame .box{position:absolute;inset:15%;border-radius:var(--radius);border:1px solid var(--primary)}
.camera-frame .tag{position:absolute;left:.75rem;top:.75rem;background:var(--primary);padding:.25rem .5rem;font-size:.62rem;font-weight:700;color:var(--on-primary)}
.camera-frame .strip{position:absolute;left:2.5rem;right:2.5rem;top:50%;height:4rem;transform:translateY(-50%);border:1px dashed var(--primary);background:rgba(127,180,255,.08)}
.big-result{text-align:center;border:1px solid rgba(251,191,36,.5)}
.big-result .num{margin:1rem 0;font-size:4.5rem;font-weight:700;color:var(--warning)}
.big-result .num span{font-size:1.5rem}
.pill{display:inline-flex;align-items:center;gap:.5rem;border-radius:var(--radius);background:rgba(251,191,36,.15);padding:.5rem 1rem;font-size:1.25rem;font-weight:700;text-transform:uppercase;color:var(--warning)}
.bar-chart{display:flex;height:16rem;align-items:flex-end;gap:.5rem;border-bottom:1px solid var(--border);border-left:1px solid var(--border);padding:1.25rem .75rem 0}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar .fill{width:100%;min-height:4px;opacity:.85}
.bar .bv{text-align:center;font-size:.85rem;margin-bottom:.5rem}
.bar .bl{text-align:center;font-size:.62rem;color:var(--muted);margin-top:.5rem}
.zone-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
@media(min-width:640px){.zone-grid{grid-template-columns:repeat(3,1fr)}}
.zone{min-height:10rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--raised);padding:1rem;text-align:left}
.zone:hover{border-color:#7d89b8}
.zone .zname{display:flex;justify-content:space-between;font-size:1.25rem;font-weight:700}
.zone .zval{margin-top:1.75rem;font-size:2.5rem;font-weight:700}
.zone .zunit{font-size:.7rem;color:var(--muted)}
label.field{display:block;font-size:.72rem;color:var(--muted);margin-bottom:1rem}
label.field select{margin-top:.25rem;height:3rem;width:100%;border-radius:var(--radius);border:1px solid var(--border);background:var(--raised);padding:0 .75rem;font-size:.85rem}
label.check{display:flex;align-items:center;gap:.75rem;font-size:.85rem;margin-bottom:.75rem}
input[type=checkbox]{width:1.25rem;height:1.25rem;accent-color:var(--primary)}
.avatar{display:grid;place-items:center;width:5rem;height:5rem;flex-shrink:0;border-radius:999px;font-size:1.9rem;font-weight:700}
.faq button.q{display:flex;width:100%;align-items:center;justify-content:space-between;gap:.75rem;padding:1rem 0;text-align:left;font-size:.85rem;font-weight:600}
.faq .a{padding-bottom:1rem;font-size:.85rem;color:var(--muted)}
.faq .item{border-bottom:1px solid var(--border)}
.faq .item:last-child{border:none}
.chat{display:flex;min-height:32rem;flex-direction:column;padding:0}
.chat .log{flex:1;display:flex;flex-direction:column;gap:.75rem;overflow-y:auto;padding:1rem}
.msg{max-width:85%;border-radius:var(--radius);padding:.5rem .75rem;font-size:.85rem}
.msg.user{align-self:flex-end;background:linear-gradient(90deg,var(--primary),var(--accent));color:var(--on-primary)}
.msg.agent{align-self:flex-start;border:1px solid var(--border);background:var(--raised)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;padding:0 1rem .5rem}
.chips button{border-radius:999px;border:1px solid var(--border);padding:.35rem .75rem;font-size:.72rem;color:var(--muted)}
.chips button:hover{border-color:var(--primary);color:var(--primary)}
.chat form{display:flex;align-items:center;gap:.5rem;border-top:1px solid var(--border);padding:.75rem}
.chat input{height:3rem;flex:1;border-radius:var(--radius);border:1px solid var(--border);background:var(--raised);padding:0 .75rem;font-size:.85rem;outline:none}
.chat input:focus{border-color:var(--primary)}
.chat .send{display:grid;place-items:center;width:3rem;height:3rem;flex-shrink:0;border-radius:var(--radius)}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,26,46,.8);backdrop-filter:blur(4px);padding:1rem}
h1.page{font-size:2.5rem;font-weight:700;text-transform:uppercase;line-height:1.05}
@media(min-width:640px){h1.page{font-size:3rem}}
.legend-row{display:flex;align-items:center;justify-content:space-between;font-size:.75rem;margin-bottom:.5rem}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= H₂S SENTINEL — standalone prototype ================= */
const $=s=>document.querySelector(s);
const app=$("#app");

const TONE_DOT=t=>`<span class="dot ${t}"></span>`;
const statuses=[
  {label:"Low",count:24,tone:"success",range:"0–29"},
  {label:"Moderate",count:7,tone:"warning",range:"30–49"},
  {label:"Elevated",count:3,tone:"elevated",range:"50–59"},
  {label:"High",count:0,tone:"danger",range:"60+"},
];
let state={
  screen:"dashboard", menu:false, bell:false,
  notices:[
    {id:1,title:"Zone C exposure elevated",body:"3 workers above 50 ppm·h this shift.",time:"2 min ago",tone:"elevated",read:false},
    {id:2,title:"Badge H2S-0412 expiring",body:"Expires in 6 days. Schedule replacement.",time:"26 min ago",tone:"warning",read:false},
    {id:3,title:"Reader OS-001 calibrated",body:"Batch B-07 curve validated successfully.",time:"1 h ago",tone:"success",read:false},
    {id:4,title:"Shift report ready",body:"Night shift summary available in Reports.",time:"3 h ago",tone:"success",read:true},
  ],
  badgeVerified:false, readingSaved:false, expiredPreview:false, reportDone:"",
  notify:{alerts:true,badge:true,reports:false},
  faqOpen:0,
  chat:[{from:"agent",text:"Hi Ananya — H₂S Sentinel support here. Ask about badges, the optical reader, or exposure results."}],
  typing:false,
};

function go(s){state.screen=s;state.menu=false;state.bell=false;render();window.scrollTo({top:0,behavior:"smooth"});}
window.go=go;
function toggle(k){state[k]=!state[k];render();}
window.toggle=toggle;

/* ---------- shared bits ---------- */
const backHeader=(title,back)=>`
  <div class="back-head">
    <button class="icon-btn" aria-label="Back" onclick="go('${back}')">←</button>
    <div><p class="title font-display">${title}</p><small>H₂S SENTINEL / UNIT A</small></div>
  </div>`;
const dataRow=(l,v)=>`<div class="data-row"><span class="l">${l}</span><span class="v">${v}</span></div>`;

/* ---------- screens ---------- */
function Dashboard(){return `
  <div style="margin-bottom:1.75rem;display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:flex-end">
    <div>
      <p style="font-size:.72rem;font-weight:600;text-transform:uppercase;color:var(--primary);margin-bottom:.5rem">Facility / Refinery Unit A</p>
      <h1 class="page">Good morning, safety officer</h1>
      <p style="margin-top:.5rem;font-size:.85rem;color:var(--muted)">Shift overview · 11 September 2026 · 06:00–18:00</p>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--success)">${TONE_DOT("success")} Systems operational</div>
  </div>
  <div class="grid-3" style="margin-bottom:1.5rem">
    <div class="panel stat"><span class="ic t-muted">👷</span><strong class="font-display">37</strong><span>Workers</span></div>
    <div class="panel stat"><span class="ic t-muted">📈</span><strong class="font-display">34</strong><span>Readings</span></div>
    <div class="panel stat" style="border-color:rgba(248,113,113,.5)"><span class="ic t-danger">⚠</span><strong class="font-display">2</strong><span>Alerts</span></div>
  </div>
  <div class="grid-2 wide-right">
    <div class="panel">
      <div class="section-title"><h2>Exposure overview</h2><button class="t-primary" style="font-size:.75rem;font-weight:600" onclick="go('map')">VIEW MAP →</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
        ${statuses.map(s=>`<div class="status-cell"><span class="lab">${TONE_DOT(s.tone)}${s.label}</span><strong class="font-display t-${s.tone}">${s.count}</strong></div>`).join("")}
      </div>
      <div class="callout" style="border-color:var(--elevated);background:rgba(251,146,60,.1)">
        <strong class="t-elevated">Zone C requires attention.</strong>
        <p style="margin-top:.25rem;font-size:.75rem;color:var(--muted)">3 elevated cumulative exposure observations this shift.</p>
      </div>
    </div>
    <div class="panel">
      <div class="section-title"><h2>Recent activity</h2></div>
      ${[["W023","Zone C","18:42","warning"],["W017","Zone A","18:31","success"],["W031","Zone C","18:20","elevated"]].map(r=>`
        <button class="activity-row" onclick="go('result')"><strong style="font-size:.85rem">${r[0]}</strong><span style="font-size:.75rem;color:var(--muted)">${r[1]}</span><span style="font-size:.75rem;color:var(--muted)">${r[2]}</span>${TONE_DOT(r[3])}</button>`).join("")}
    </div>
  </div>
  <div class="grid-2" style="margin-top:1.5rem;gap:.75rem">
    <button class="btn" onclick="go('scan')">▦ Scan badge</button>
    <button class="btn secondary" onclick="go('reader')">⏚ Optical reader</button>
  </div>
  <div class="grid-4" style="margin-top:2rem">
    <button class="quick" onclick="go('history')">🕑 Worker history <span style="margin-left:auto;color:var(--muted)">›</span></button>
    <button class="quick" onclick="go('map')">🗺 Exposure map <span style="margin-left:auto;color:var(--muted)">›</span></button>
    <button class="quick" onclick="go('badges')">🪪 Badge status <span style="margin-left:auto;color:var(--muted)">›</span></button>
    <button class="quick" onclick="go('reports')">⬇ Reports <span style="margin-left:auto;color:var(--muted)">›</span></button>
  </div>
  <p style="margin-top:2rem;text-align:center;font-size:.62rem;text-transform:uppercase;color:var(--muted)">Measurement chain: H₂S chemical strip → optical reader → validated estimate</p>`;}

function ScanScreen(){return `<div class="wrap">
  ${backHeader("Scan badge","dashboard")}
  ${!state.badgeVerified?`
    <div class="scan-frame industrial-grid"><div class="inner"></div><div style="font-size:11rem;color:var(--primary);line-height:1">▦</div><span class="hint">Position badge inside frame</span></div>
    <button class="btn" style="max-width:22rem;margin:0 auto" onclick="state.badgeVerified=true;render()">▦ Scan badge</button>
    <p style="margin-top:1.5rem;text-align:center;font-size:.85rem;color:var(--muted)">Or enter Badge ID manually</p>`
  :`<div class="panel">
    <div style="display:flex;align-items:center;gap:.75rem;border-bottom:1px solid var(--border);padding-bottom:1.25rem;margin-bottom:1rem">
      <span style="display:grid;place-items:center;width:3rem;height:3rem;border-radius:999px;background:rgba(52,211,153,.15);color:var(--success);font-size:1.4rem">✓</span>
      <div><h2 class="font-display" style="font-size:1.5rem;font-weight:700;text-transform:uppercase">Badge verified</h2><p style="font-size:.85rem;color:var(--success)">Valid for use</p></div>
    </div>
    ${dataRow("Badge ID","H2S-0237")}${dataRow("Batch","B-07")}${dataRow("Worker","W023")}${dataRow("Expiry","30 Nov 2026")}
    <button class="btn" style="margin-top:1.5rem" onclick="go('reader')">Start shift ›</button>
  </div>`}
</div>`;}

function CameraScreen(){return `<div class="wrap lg">
  ${backHeader("H₂S strip reading","reader")}
  <div class="grid-2 wide-right" style="align-items:start">
    <div class="camera-frame industrial-grid">
      <div class="box"><span class="tag">STRIP + REFERENCE</span><div class="strip"></div></div>
    </div>
    <div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1.25rem">
        ${["Strip","Reference","Badge"].map(x=>`<div style="display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--success)">✓ ${x} detected</div>`).join("")}
      </div>
      <button class="btn" onclick="go('result')">📷 Capture</button>
      <p style="margin-top:1rem;text-align:center;font-size:.75rem;color:var(--muted)">Image analysis supports the optical reader; the phone does not detect H₂S.</p>
      ${stripReference(true)}
    </div>
  </div>
</div>`;}

function ReaderScreen(){return `<div class="wrap lg">
  ${backHeader("Optical reader","dashboard")}
  <div style="display:flex;align-items:flex-start;justify-content:space-between;border-radius:var(--radius);border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.1);padding:1rem;margin-bottom:1.25rem">

function chatReply(q){
  const t=q.toLowerCase();
  if(t.includes("badge")||t.includes("expir"))return"Badges stay valid until their printed expiry date. Open Badge status to check the digital record and the physical expiry indicator for badge H2S-0237.";
  if(t.includes("reader")||t.includes("connect"))return"Reader OS-001 is connected on firmware 2.4.1 at 82% battery. If the bay light stays off, reseat the badge and restart the reader.";
  if(t.includes("result")||t.includes("ppm")||t.includes("exposure"))return"Results are estimates within the experimentally validated range: chemical strip → optical reader → software estimate. The latest W023 reading is 52.4 ppm·h (moderate).";
  if(t.includes("zone")||t.includes("map"))return"Zone C is showing repeated elevated readings this shift. Open the exposure map for the zone breakdown.";
  if(t.includes("report")||t.includes("export"))return"Go to Reports to build a PDF or CSV for any worker, zone, shift, or date range.";
  return"Thanks — a safety systems engineer will follow up shortly. Meanwhile the FAQ covers badges, reader connection, reading quality and replacements.";
}
function sendChat(text){
  const t=(text||"").trim(); if(!t)return;
  state.chat.push({from:"user",text:t}); state.typing=true; render();
  setTimeout(()=>{state.typing=false;state.chat.push({from:"agent",text:chatReply(t)});render();},800);
}

              </div>`).join("")}
            </div>
            <button class="t-primary" style="display:block;width:100%;border-top:1px solid var(--border);padding:.75rem 1rem;font-size:.72rem;font-weight:600" onclick="go('help')">Need help? Open support chat →</button>
          </div>`:""}
        </div>
        <button class="icon-btn" style="width:2.5rem;height:2.5rem;${state.screen==="profile"?"border-color:var(--primary);color:var(--primary)":"color:var(--muted)"}" aria-label="Profile" onclick="go('profile')">👤</button>
        <button class="icon-btn menu-btn" style="width:2.5rem;height:2.5rem" aria-label="Open menu" onclick="toggle('menu')">${state.menu?"✕":"☰"}</button>
      </div>
    </div>
    ${state.menu?`<div class="mobile-menu">
      ${[["Dashboard","dashboard"],["Scan badge","scan"],["Optical reader","reader"],["Worker history","history"],["Exposure map","map"],["Badge status","badges"],["Reports","reports"],["Calibration mode","calibration"],["My profile","profile"],["Help & support","help"]].map(n=>`<button onclick="go('${n[1]}')">${n[0]}<span>›</span></button>`).join("")}
    </div>`:""}
  </header>
  <main class="container">${screens[state.screen]()}</main>
  <nav class="bottom-nav"><div class="in">
    ${[["⌂","Home","dashboard"],["▦","Scan","scan"],["⏚","Reader","reader"],["🗺","Map","map"]].map(n=>`<button class="${state.screen===n[2]?"active":""}" onclick="go('${n[2]}')"><span style="font-size:1.1rem">${n[0]}</span>${n[1]}</button>`).join("")}
  </div></nav>`;
  const log=$("#chatLog"); if(log)log.scrollTop=log.scrollHeight;
}
render();
</script>
</body>
</html>
